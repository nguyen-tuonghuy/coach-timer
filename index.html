<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#161914">
    <title>Coach Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="timer-shell">
      <section id="routines-screen" class="screen" aria-labelledby="routines-title">
        <header class="app-header">
          <div>
            <p class="eyebrow">Coach Timer</p>
            <h1 id="routines-title">Mes routines</h1>
          </div>
          <button id="new-routine-button" class="button button-primary" type="button">Nouvelle routine</button>
        </header>
        <div id="routine-list" class="routine-list"></div>
      </section>

      <section id="editor-screen" class="screen" aria-labelledby="editor-title" hidden>
        <header class="app-header">
          <div>
            <p class="eyebrow">Éditeur</p>
            <h1 id="editor-title">Modifier la routine</h1>
          </div>
          <button id="editor-cancel-button" class="button" type="button">Annuler</button>
        </header>
        <form id="routine-form" class="editor-card">
          <label class="field">
            <span>Nom de la routine</span>
            <input id="routine-name-input" name="name" type="text" required maxlength="80">
          </label>
          <label class="field">
            <span>Transition par défaut</span>
            <select id="default-transition-input" name="default-transition">
              <option value="" selected>Choisir…</option>
              <option value="manual">Manuelle</option>
              <option value="auto">Automatique</option>
              <option value="delay">Délai chronométré</option>
            </select>
          </label>
          <label id="default-delay-field" class="field" hidden>
            <span>Durée du délai par défaut (s)</span>
            <input id="default-delay-input" name="default-delay" type="number" min="0.1" step="0.1" value="5">
          </label>
          <div id="blocks-editor" class="blocks-editor"></div>
          <button id="add-block-button" class="button" type="button">Ajouter un bloc</button>
          <p id="editor-error" class="editor-error" role="alert" hidden></p>
          <button class="button button-primary editor-save" type="submit">Enregistrer la routine</button>
        </form>
      </section>

      <section id="player-screen" class="screen" aria-labelledby="player-title" hidden>
      <header class="app-header">
        <div>
          <p class="eyebrow">Coach Timer</p>
          <h1 id="player-title">Lecture de séance</h1>
        </div>
        <div class="header-controls">
          <button id="sound-toggle-button" class="button" type="button" aria-pressed="true">Son activé</button>
          <button id="back-to-routines-button" class="button" type="button">Mes routines</button>
        </div>
      </header>

      <section class="timer-card" aria-labelledby="step-label">
        <div class="status-line">
          <span id="status-badge" class="status-badge">Prêt</span>
          <span id="progress-label">Étape 0 / 0</span>
        </div>

        <div class="timer-stage">
          <p id="phase-label" class="phase-label">Séance prête</p>
          <h2 id="step-label">Choisissez une routine</h2>
          <output id="time-display" class="time-display">00:00</output>
          <p id="round-label" class="round-label">&nbsp;</p>
        </div>

        <p id="live-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>

        <div class="next-step">
          <span>Prochaine étape</span>
          <div class="next-step-details">
            <strong id="next-label">—</strong>
            <span id="transition-label" class="transition-label"></span>
          </div>
        </div>

        <button id="go-button" class="go-button" type="button" hidden>GO</button>

        <div class="primary-controls">
          <button id="start-button" class="button button-primary" type="button">Démarrer</button>
          <button id="pause-button" class="button button-primary" type="button" hidden>Pause</button>
          <button id="resume-button" class="button button-primary" type="button" hidden>Reprendre</button>
        </div>

        <div id="session-controls" class="session-controls" hidden>
          <button id="previous-button" class="button" type="button">Précédente</button>
          <button id="restart-button" class="button" type="button">Recommencer</button>
          <button id="next-button" class="button" type="button">Suivante</button>
          <button id="stop-button" class="button button-danger" type="button">Arrêter</button>
        </div>
      </section>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
